[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runway-backend"
version = "0.1.0"
requires-python = ">=3.12"
description = "Runway backend API (FastAPI)"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
    "httpx",
    "email-validator",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt<4.0",
    "python-multipart",
    "numpy==1.26.4",
    "Pillow",
]

[tool.vercel]
entrypoint = "app.main:app"
